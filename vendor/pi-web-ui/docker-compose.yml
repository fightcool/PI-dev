# One-command deploy: `docker compose up -d`
# Auto-restarts on boot when the Docker daemon starts (restart: unless-stopped).
services:
  pi-web-ui:
    build: .
    image: pi-web-ui:latest
    ports:
      - "8787:8787"
    environment:
      PI_WEB_PORT: "8787"
      # The container must bind ALL interfaces so the -p port mapping works —
      # the server defaults to loopback-only for security.
      PI_WEB_HOST: "0.0.0.0"
      # DSH engine (DeepSeek Harness subprocess, see docs/dsh-engine.md).
      # The image already bundles the runtime tree; uncomment to switch:
      # PI_WEB_ENGINE: "dsh"
      # DSH user patches dir override (default: <PI_WEB_DATA_DIR>/dsh-patches):
      # PI_WEB_DSH_PATCH_DIR: /dsh-patches
      # volumes:
      #   - /host/path/to/dsh-patches:/dsh-patches
      # Workspace the agent operates in (read/edit/bash/write). Mount your
      # project dir and point PI_WEB_CWD at it, e.g.:
      # PI_WEB_CWD: /workspace
      # volumes:
      #   - /host/path/to/project:/workspace
      # pi config (auth.json, models, skills) — mount ~/.pi/agent read-only:
      # PI_CODING_AGENT_DIR: /pi-agent
      # volumes:
      #   - /home/YOU/.pi/agent:/pi-agent:ro
    volumes:
      # Persist per-client chat sessions across container restarts.
      - pi-web-data:/app/.pi-web
    restart: unless-stopped

volumes:
  pi-web-data:
