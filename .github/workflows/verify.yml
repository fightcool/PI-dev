name: Rebuild and Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Rebuild locked environment
        run: bash scripts/bootstrap.sh
      - name: Environment tests
        run: npm test
      - name: Python isolation test
        run: .venv/bin/python -m pytest tests/test_environment.py -q
      - name: Service smoke without systemd
        run: node scripts/ci-smoke.mjs
      - name: Publication safety checks
        run: npm run check:publish
      - name: Dependency audit
        run: npm audit --audit-level=moderate
